name: Generate snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=8bbee9&color_dots=#ebedf0,#cfe3f5,#a9cfef,#8bbee9,#4ca4ec
            dist/github-snake-dark.svg?palette=github-dark&color_snake=8bbee9&color_dots=#161b22,#1f3a52,#2f5f86,#4ca4ec,#8bbee9

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

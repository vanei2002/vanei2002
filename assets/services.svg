<svg xmlns="http://www.w3.org/2000/svg" width="840" height="180" viewBox="0 0 840 180">
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .card { fill: #0d1117; stroke: #30363d; }
    .icon { fill: #8bbee9; font-size: 24px; font-weight: 700; }
    .title { fill: #ffffff; font-size: 13px; font-weight: 700; }
    .desc { fill: #8b949e; font-size: 12px; }
    .bar { fill: #8bbee9; animation: glow 3s ease-in-out infinite; }
    @keyframes glow { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
  </style>

  <g class="mono">
    <rect x="0.5" y="0.5" width="194" height="179" rx="10" class="card"/>
    <rect x="18" y="0.5" width="60" height="3" rx="1.5" class="bar"/>
    <text x="18" y="52" class="icon">&gt;_</text>
    <text x="18" y="88" class="title">AI Agents</text>
    <text class="desc"><tspan x="18" y="114">WhatsApp agents,</tspan><tspan x="18" y="132">copilots and RAG</tspan><tspan x="18" y="150">over internal docs</tspan></text>

    <rect x="215.5" y="0.5" width="194" height="179" rx="10" class="card"/>
    <rect x="233" y="0.5" width="60" height="3" rx="1.5" class="bar" style="animation-delay:.75s"/>
    <text x="233" y="52" class="icon">&lt;/&gt;</text>
    <text x="233" y="88" class="title">SaaS &amp; MVPs</text>
    <text class="desc"><tspan x="233" y="114">Products built from</tspan><tspan x="233" y="132">scratch, ready</tspan><tspan x="233" y="150">to scale</tspan></text>

    <rect x="430.5" y="0.5" width="194" height="179" rx="10" class="card"/>
    <rect x="448" y="0.5" width="60" height="3" rx="1.5" class="bar" style="animation-delay:1.5s"/>
    <text x="448" y="52" class="icon">{ }</text>
    <text x="448" y="88" class="title">APIs &amp; Integrations</text>
    <text class="desc"><tspan x="448" y="114">ERPs, CRMs and MCP</tspan><tspan x="448" y="132">servers wired into</tspan><tspan x="448" y="150">your AI</tspan></text>

    <rect x="645.5" y="0.5" width="194" height="179" rx="10" class="card"/>
    <rect x="663" y="0.5" width="60" height="3" rx="1.5" class="bar" style="animation-delay:2.25s"/>
    <text x="663" y="52" class="icon">λ</text>
    <text x="663" y="88" class="title">Cloud &amp; Architecture</text>
    <text class="desc"><tspan x="663" y="114">AWS, Docker and</tspan><tspan x="663" y="132">systems built</tspan><tspan x="663" y="150">to last</tspan></text>
  </g>
</svg>
